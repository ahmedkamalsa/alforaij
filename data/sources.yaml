sources:
  - id: alforaij_board
    name: الفريج - لوحة البيانات المحلية
    status: connected
    connector: backend.connectors.alforaij
    records_file: data/seed_listings.json
    notes:
      - المصدر الحالي هو payload المضمن داخل site/index.html من مشروع alforaijboard.
      - المساحة تعتمد على الحقل الصريح space أو نص مساحة واضح، وليس على الارتداد أو الواجهة.
  - id: alforaij_front
    name: منصة الفريج الأصلية
    status: manual_link_only
    base_url: https://front.alforaij.com/
    notes:
      - الروابط الأصلية محفوظة داخل كل إعلان.
      - لا يتم سحب خارجي مباشر الآن لتجنب تسجيل دخول أو شروط غير واضحة.
  - id: official_transactions
    name: صفقات رسمية مستقبلية
    status: planned
    notes:
      - تحتاج مصدر رسمي أو ملف مستورد قبل استخدامها كدليل تقييم قوي.
  - id: sakan
    name: Sakan
    status: page_reachable
    url: https://sakan.co/en
    notes:
      - يتم فحص صفحة البحث الحية وإظهار عدد المتاح عند ظهوره.
      - تفاصيل الإعلانات لا تظهر كبيانات منظمة في HTML العام، لذلك تحتاج API أو تحليل endpoint داخلي مسموح.
  - id: opensooq_kw
    name: السوق المفتوح الكويت
    status: live_jsonld
    url: https://kw.opensooq.com
    notes:
      - يتم استخراج نتائج فعلية من JSON-LD العام في صفحة النتائج.
      - تدخل النتائج في المطابقة والتقييم مع وسم المصدر.
  - id: mourjan_kw
    name: مرجان الكويت
    status: live_html
    url: https://www.mourjan.com/kw/
    notes:
      - يتم استخراج كروت إعلانات فعلية من HTML صفحة البحث العامة.
      - تدخل النتائج في المطابقة والتقييم مع وسم المصدر.
  - id: q8aqar
    name: دليل عقارات الكويت Q8Aqar
    status: live_links
    url: https://www.q8aqar.com
    notes:
      - يتم استخراج روابط تفاصيل فعلية من صفحات المناطق.
      - تدخل كمصدر خارجي، لكن غالبًا تحتاج فتح التفاصيل لتحسين السعر والمساحة.
  - id: propertyfinder_kw
    name: Property Finder Kuwait
    status: blocked_geo
    url: https://www.propertyfinder.kw/
    connector: backend.connectors.live_sources.search_propertyfinder
    notes:
      - منصة عقارية كويتية نشطة، لكنها لا تستجيب من شبكات الخوادم (مهلة زمنية بعد 4 محاولات) — يرجّح حجب جغرافي/IP للخوادم.
      - الموصل يحاول صفحات البحث ويستخرج بيانات JSON-LD/الحمولة المضمّنة عند توفرها، ويُسجَّل حالته الحقيقية يوميًا.
      - بمجرد توفر الوصول تبدأ نتائجها في دخول البحث والتقييم وقاعدة المعرفة تلقائيًا.
  - id: aqarmap_kw
    name: Aqarmap Kuwait (عقارماب)
    status: discontinued
    url: https://aqarmap.com/kw/
    connector: backend.connectors.live_sources.search_aqarmap
    notes:
      - النسخة الكويتية من عقارماب لم تعد متاحة: المسار /kw/ يعيد حاليًا بوابة مصر (عنوان الصفحة «عقارماب مصر»).
      - الموصل يتحقق من هوية الصفحة ويعيد حالة discontinued بدل بيانات مغلوطة من بوابة أخرى.
      - إذا أعادت عقارماب تفعيل نسخة الكويت سيبدأ الموصل باستخراج البيانات تلقائيًا.
  - id: bayut_kw
    name: Bayut Kuwait (بيوت)
    status: bot_protected
    url: https://www.bayut.com/kuwait/
    connector: backend.connectors.live_sources.search_bayut
    notes:
      - بوابة بيوت تحمي صفحاتها بنظام captcha (hb.captcha.bayut.com) — لا يمكن قراءة الإعلانات برمجيًا دون تجاوز الحماية (غير مسموح).
      - الموصل يحاول الجلب، يكشف صفحة التحدي، ويُسجَّل حالة blocked بشفافية في السجل اليومي بدل ادعاء نجاح وهمي.
  - id: e_gov_kw_portal
    name: بوابة الكويت العقارية (e.gov.kw)
    status: official_service
    url: https://www.e.gov.kw/sites/kgoArabic/Pages/ServicesPortal/RealEstateServices.aspx
    notes:
      - مرجع حكومي للخدمات العقارية (الاستعلام عن العقار وخدمات التسجيل) وليس سوق إعلانات مفتوحًا — لا يوجد تغذية إعلانات عامة.
      - يُفحص توفره يوميًا ضمن المصادر الرسمية (يعيد حاليًا HTTP 403 من حماية WAF للخوادم).
  - id: paci_kuwait_finder
    name: Kuwait Finder (PACI)
    status: geo_verification
    url: https://kuwaitfinder.paci.gov.kw/
    notes:
      - التطبيق المكاني الرسمي للهيئة العامة للمعلومات المدنية — دور تأكيد الموقع/المنطقة/القطعة وليس مصدر سعر.
      - غير قابل للوصول من شبكات الخوادم حاليًا (لا استجابة)؛ يُفحص توفره يوميًا ضمن المصادر الرسمية.

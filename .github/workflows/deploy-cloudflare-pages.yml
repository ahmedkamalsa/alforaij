name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  cloudflare-pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure API base
        run: |
          cat > frontend/config.js <<'EOF'
          window.ALFORAIJ_API_BASE = "${{ vars.ALFORAIJ_API_BASE }}";
          EOF
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare Pages deploy is not configured. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets."
            exit 0
          fi
          npx --yes wrangler pages deploy frontend --project-name="${CLOUDFLARE_PAGES_PROJECT_NAME:-alforaij}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

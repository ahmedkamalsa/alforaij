name: "[DISABLED] Deploy to Cloudflare Pages"

# ⚠️ معطّل — النشر محلي فقط. لا تشغّل هذا الملف.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب YES للتأكيد'
        required: true
        type: string

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  cloudflare-pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure API base
        run: |
          cat > frontend/config.js <<'EOF'
          window.ALFORAIJ_API_BASE = "${{ vars.ALFORAIJ_API_BASE }}";
          EOF
      - name: Generate static data snapshot
        run: python scripts/export_static_frontend_data.py
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare Pages deploy is not configured. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets."
            exit 0
          fi
          npx --yes wrangler pages deploy frontend --project-name="${CLOUDFLARE_PAGES_PROJECT_NAME:-alforaij}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

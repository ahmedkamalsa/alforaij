name: "[DISABLED] Deploy alforaijboard Pages"

# ⚠️ معطّل — النشر محلي فقط. لا تشغّل هذا الملف.
# كان ينشر إلى ahmedkamalsa/alforaijboard gh-pages.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب YES للتأكيد'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-alforaijboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure API base (static mode)
        run: |
          cat > frontend/config.js <<'EOF'
          window.ALFORAIJ_API_BASE = "";
          EOF

      - name: Generate static data snapshot
        run: python scripts/export_static_frontend_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AGENT_ROUTER_API_KEY: ${{ secrets.AGENT_ROUTER_API_KEY }}

      - name: Push frontend to alforaijboard gh-pages
        env:
          TOKEN: ${{ secrets.ALFORAIJBOARD_TOKEN }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then
            echo "::error::ALFORAIJBOARD_TOKEN secret is missing. Add a PAT with 'repo' scope for ahmedkamalsa/alforaijboard."
            exit 1
          fi
          rm -rf /tmp/board-deploy
          mkdir -p /tmp/board-deploy
          cp -r frontend/. /tmp/board-deploy/
          cd /tmp/board-deploy
          git init -q
          git checkout -q -B gh-pages
          git add -A
          git -c user.email="actions@github.com" -c user.name="GitHub Actions" \
            commit -q -m "Deploy alforaijboard $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push -q -f "https://x-access-token:${TOKEN}@github.com/ahmedkamalsa/alforaijboard.git" gh-pages
          echo "Pushed to https://github.com/ahmedkamalsa/alforaijboard/tree/gh-pages"

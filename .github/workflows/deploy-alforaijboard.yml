name: Deploy alforaijboard Pages

on:
  push:
    branches: [main]
    paths:
      - "alforaijboard/**"
      - "frontend/**"
      - ".github/workflows/deploy-alforaijboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-alforaijboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure API base (static mode)
        run: |
          cat > frontend/config.js <<'EOF'
          window.ALFORAIJ_API_BASE = "${{ vars.ALFORAIJ_API_BASE }}";
          EOF

      - name: Generate static data snapshot
        run: python scripts/export_static_frontend_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AGENT_ROUTER_API_KEY: ${{ secrets.AGENT_ROUTER_API_KEY }}

      - name: Push frontend to alforaijboard gh-pages
        env:
          TOKEN: ${{ secrets.ALFORAIJBOARD_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/board-deploy
          mkdir -p /tmp/board-deploy
          cp -r frontend/. /tmp/board-deploy/
          cd /tmp/board-deploy
          git init -q
          git checkout -q -B gh-pages
          git add -A
          git -c user.email="actions@github.com" -c user.name="GitHub Actions" \
            commit -q -m "Deploy alforaijboard $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          if [ -n "$TOKEN" ]; then
            git push -q -f "https://x-access-token:${TOKEN}@github.com/ahmedkamalsa/alforaijboard.git" gh-pages || echo "Warning: Push to external repo ahmedkamalsa/alforaijboard failed."
          fi
          echo "Pushed to https://github.com/ahmedkamalsa/alforaijboard/tree/gh-pages"

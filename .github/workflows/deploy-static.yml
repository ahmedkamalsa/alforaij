name: Deploy static frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data/**"
      - "frontend/**"
      - "scripts/export_static_frontend_data.py"
      - "netlify.toml"
      - ".github/workflows/deploy-static.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-static
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure API base
        run: |
          cat > frontend/config.js <<'EOF'
          window.ALFORAIJ_API_BASE = "${{ vars.ALFORAIJ_API_BASE }}";
          EOF
      - name: Generate static data snapshot
        run: python scripts/export_static_frontend_data.py
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - name: Upload Netlify artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-frontend
          path: frontend

  github-pages:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.private == false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  github-pages-private-note:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.private == true }}
    steps:
      - name: Explain GitHub Pages skip
        run: |
          echo "GitHub Pages is skipped because this repository is private and the current GitHub plan does not support Pages for private repositories."
          echo "Use Netlify for private-source deployment, or make the repository public/upgrade GitHub plan to enable Pages."

  netlify:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netlify-frontend
          path: frontend
      - name: Deploy to Netlify
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Netlify deploy is not configured. Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID as GitHub Actions secrets to enable it."
            echo "GitHub Pages remains the primary deploy path when this repository is public."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir=frontend --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

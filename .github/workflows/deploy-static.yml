name: Verify static frontend (read-only)

# ⚠️ هذا الملف لا يُنشئ أي نشر —GH Pages حصرية لـ deploy-alforaijboard.yml.
# الدور: توليد اللقطة الثابتة والتحقق من سلامتها فقط (لا صلاحيات كتابة).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data/**"
      - "frontend/**"
      - "scripts/export_static_frontend_data.py"
      - ".github/workflows/deploy-static.yml"

permissions:
  contents: read

concurrency:
  group: verify-static
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure API base
        run: |
          cat > frontend/config.js <<'EOF'
          window.ALFORAIJ_API_BASE = "${{ vars.ALFORAIJ_API_BASE }}";
          EOF
      - name: Generate static data snapshot
        run: python scripts/export_static_frontend_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AGENT_ROUTER_API_KEY: ${{ secrets.AGENT_ROUTER_API_KEY }}
      - name: Verify frontend files exist
        run: |
          echo "=== Static snapshot verification ==="
          echo "Files in frontend/:"
          ls -la frontend/ | head -20
          echo ""
          echo "index.html exists: $(test -f frontend/index.html && echo 'YES' || echo 'NO')"
          echo "config.js exists: $(test -f frontend/config.js && echo 'YES' || echo 'NO')"
          echo "styles.css exists: $(test -f frontend/styles.css && echo 'YES' || echo 'NO')"
          echo "app.js exists: $(test -f frontend/app.js && echo 'YES' || echo 'NO')"
          echo ""
          echo "✅ Static snapshot generated successfully."
          echo "📝 Deployment is handled by deploy-alforaijboard.yml (gh-pages) and deploy-static.yml (Netlify)."

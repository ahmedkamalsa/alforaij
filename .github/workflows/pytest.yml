name: Backend pytest suite

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pytest.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pytest.yml"

permissions:
  contents: read

concurrency:
  group: pytest
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pypdf  # pypdf: تقرير PDF يُختبر بقراءة ملف (اختبار فقط)
      - name: Run pytest suite
        run: python -m pytest tests/ -q

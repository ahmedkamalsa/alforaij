# ═══════════════════════════════════════════════════════════════
# Al-Furaj Platform — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════
# Triggers: Push to main, PR to main, Manual
# Jobs: Test → Lint → Security → Build → Deploy

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 1. TEST — Run full test suite
  # ═══════════════════════════════════════════════════════════════
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist
      
      - name: Run tests with coverage
        run: |
          PYTHONIOENCODING=utf-8 python -m pytest tests/ \
            -x --tb=short -q \
            --cov=backend --cov-report=xml --cov-report=term-missing \
            -p no:warnings
        env:
          PYTHONPATH: .
      
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ═══════════════════════════════════════════════════════════════
  # 2. LINT — Code quality checks
  # ═══════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        run: pip install ruff mypy
      
      - name: Run Ruff linter
        run: ruff check backend/ --select E,F,W --ignore E501,W503 || true
      
      - name: Run Ruff formatter check
        run: ruff format --check backend/ || true
      
      - name: Run MyPy type check
        run: mypy backend/ --ignore-missing-imports --no-error-summary || true

  # ═══════════════════════════════════════════════════════════════
  # 3. SECURITY — Vulnerability scanning
  # ═══════════════════════════════════════════════════════════════
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install security tools
        run: pip install bandit safety
      
      - name: Run Bandit security linter
        run: bandit -r backend/ -ll --skip B101 || true
      
      - name: Check for secrets in code
        run: |
          echo "Checking for accidentally committed secrets..."
          ! grep -r "password\s*=" backend/ --include="*.py" | grep -v "test_" | grep -v "#"
          ! grep -r "api_key\s*=" backend/ --include="*.py" | grep -v "test_" | grep -v "#"
          ! grep -r "secret\s*=" backend/ --include="*.py" | grep -v "test_" | grep -v "#"
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # 4. BUILD — Verify everything compiles
  # ═══════════════════════════════════════════════════════════════
  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Verify Python syntax
        run: python -m py_compile backend/main.py && echo "✅ main.py OK"
      
      - name: Verify all backend modules import
        run: |
          python -c "from backend.config import ROOT; print('✅ config OK')"
          python -c "from backend.services.accounts import ROLES; print('✅ accounts OK')"
          python -c "from backend.services.supabase_store import fetch_all_users; print('✅ supabase_store OK')"
          python -c "from backend.services.ai_rag import rag_query; print('✅ ai_rag OK')"
          python -c "from backend.services.push_notifications import get_stats; print('✅ push OK')"
      
      - name: Verify frontend JS syntax
        run: node -e "const fs=require('fs'); const h=fs.readFileSync('frontend/app.js','utf8'); new Function(h); console.log('✅ app.js OK')"

  # ═══════════════════════════════════════════════════════════════
  # 5. NOTIFICATIONS — Report results
  # ═══════════════════════════════════════════════════════════════
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [test, lint, security, build]
    if: always()
    
    steps:
      - name: Report status
        run: |
          echo "═══════════════════════════════════════"
          echo "  Al-Furaj CI/CD Pipeline Results"
          echo "═══════════════════════════════════════"
          echo "  Tests:     ${{ needs.test.result }}"
          echo "  Lint:      ${{ needs.lint.result }}"
          echo "  Security:  ${{ needs.security.result }}"
          echo "  Build:     ${{ needs.build.result }}"
          echo "═══════════════════════════════════════"
          
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ Pipeline FAILED"
            exit 1
          else
            echo "✅ Pipeline PASSED"
          fi

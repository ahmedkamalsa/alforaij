name: "[DISABLED] Daily data update"

# ⚠️ معطّل — البيانات تُحدَّث يدويًا فقط.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب YES للتأكيد'
        required: true
        type: string

permissions:
  # contents: write -> يسمح للوكيل بالتزام بيانات data/ ودفعها تلقائيًا بعد الحصاد.
  # actions: write  -> يسمح بتشغيل عمليات النشر عبر gh workflow run من GITHUB_TOKEN.
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily data update agent
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not configured; skipping."
            exit 0
          fi
          python scripts/daily_data_update.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AGENT_ROUTER_API_KEY: ${{ secrets.AGENT_ROUTER_API_KEY }}
          OFFICIAL_TRANSACTIONS_SOURCE: ${{ vars.OFFICIAL_TRANSACTIONS_SOURCE }}
      - name: Check harvest governorates (fail on unresolved areas)
        # ضمانة يومية: كل منطقة تظهر في market_listings يجب أن تُحل إلى محافظة في
        # اللوحة (نفس ضمانة tests/test_market_listings_governorates.py ضد القاعدة
        # الحية). أي منطقة حصاد جديدة بلا إسناد تُفشل الخطوة — ويظهر تقريرها في
        # ملخص التشغيل (GITHUB_STEP_SUMMARY) مع عددها ومصادرها وعيناتها — ويُصلَح
        # بإضافة الإسناد إلى AREA_TO_GOVERNORATE في request_parser.py.
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase not configured; skipping governorate check."
            exit 0
          fi
          python scripts/check_harvest_governorates.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Send opportunity alerts to saved searches (ready-gated)
        # بوابة الجاهزية داخل السكربت: إن اعتُمدت القوالب الثلاثة (OTP + فرصة +
        # انخفاض السعر) أُرسلت تنبيهات الوكيل عبر واتساب؛ وإلا تُوثَّق الحالة في
        # ملخص التشغيل (GITHUB_STEP_SUMMARY) ويُكتفى بالجرس — ولا يكسر الحصاد أبدًا.
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase not configured; skipping alerts."
            exit 0
          fi
          python scripts/send_opportunity_alerts.py || echo "Alert run finished with warnings (bell-only fallback)."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_WABA_ID: ${{ secrets.WHATSAPP_WABA_ID }}
          WHATSAPP_ALERT_TEMPLATE: ${{ secrets.WHATSAPP_ALERT_TEMPLATE }}
      - name: Commit and push harvested data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes after harvest; nothing to commit."
            exit 0
          fi
          git commit -m "تحديث البيانات اليومي $(date -u +%Y-%m-%d): التزام تلقائي بعد الحصاد"
          git push
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Trigger static redeploy with fresh data
        env:
          # gh يرفض العمل داخل Actions بدون GH_TOKEN صريح، لذا نمرره دائمًا:
          # الـ PAT إن كان مضبوطًا، وإلا GITHUB_TOKEN (بصلاحية actions: write).
          GH_TOKEN: ${{ secrets.ALFORAIJBOARD_TOKEN || github.token }}
        run: |
          # الدفع في الخطوة السابقة يتم بالـ GITHUB_TOKEN، وغيت هاب لا يشغّل
          # عمليات النشر تلقائيًا عند الدفع بمثل هذا التوكن (حماية من التكرار)،
          # لذلك نشغّل النشر صراحةً هنا ليصل الحصاد الجديد للمواقع خلال دقائق.
          # الجدول اليومي 04:00 UTC يبقى احتياطًا إضافيًا.
          gh workflow run deploy-static.yml
          gh workflow run deploy-cloudflare-pages.yml

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>غير متصل — منصة الفريج العقارية</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Arial, system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e8eef7;
      direction: rtl;
    }
    
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    
    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #b7a13a, #d9b850);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 1rem;
      color: #b3c2d5;
      margin-bottom: 1.5rem;
    }
    
    .features {
      text-align: right;
      margin: 1.5rem 0;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .features h3 {
      font-size: 0.9rem;
      color: #d9b850;
      margin-bottom: 0.8rem;
    }
    
    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0;
      font-size: 0.85rem;
      color: #b3c2d5;
    }
    
    .feature-item .check {
      color: #4ade80;
      font-weight: bold;
    }
    
    .feature-item .cross {
      color: #fca5a5;
    }
    
    .retry-btn {
      background: linear-gradient(135deg, #b7a13a, #a8860f);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(183, 161, 58, 0.3);
      margin-top: 1rem;
    }
    
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(183, 161, 58, 0.4);
    }
    
    .retry-btn:active {
      transform: translateY(0);
    }
    
    .cached-link {
      display: inline-block;
      margin-top: 1rem;
      color: #b3c2d5;
      font-size: 0.85rem;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    
    .cached-link:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.25);
    }
    
    .status {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #64748b;
    }
    
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fca5a5;
      margin-left: 4px;
      animation: blink 1.5s ease-in-out infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .container { padding: 1.5rem; }
      h1 { font-size: 1.5rem; }
      .icon { font-size: 4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>غير متصل بالإنترنت</h1>
    <p class="subtitle">تحقق من اتصالك بالشبكة وحاول مرة أخرى</p>
    
    <div class="features">
      <h3>📋 ما هو متاح بدون اتصال:</h3>
      <div class="feature-item">
        <span class="check">✓</span>
        <span>لوحة السوق (البيانات المحفوظة)</span>
      </div>
      <div class="feature-item">
        <span class="check">✓</span>
        <span>آخر تحليل بحث تم حفظه</span>
      </div>
      <div class="feature-item">
        <span class="check">✓</span>
        <span>صفحة الأسعار والمميزات</span>
      </div>
      <div class="feature-item">
        <span class="cross">✗</span>
        <span>بحث جديد (يتطلب اتصال)</span>
      </div>
      <div class="feature-item">
        <span class="cross">✗</span>
        <span>تنبيهات واتساب</span>
      </div>
    </div>
    
    <button class="retry-btn" onclick="window.location.reload()">
      🔄 إعادة المحاولة
    </button>
    
    <a href="/" class="cached-link">
      🏠 العودة للرئيسية
    </a>
    
    <div class="status">
      <span class="status-dot"></span>
      اتصال الشبكة غير متاح
    </div>
  </div>
  
  <script>
    // مراقبة عودة الاتصال
    window.addEventListener('online', () => {
      document.querySelector('.status-dot').style.background = '#4ade80';
      document.querySelector('.status').innerHTML = 
        '<span class="status-dot" style="background:#4ade80"></span> عاد الاتصال — جاري التحديث...';
      setTimeout(() => window.location.reload(), 1000);
    });
    
    window.addEventListener('offline', () => {
      document.querySelector('.status-dot').style.background = '#fca5a5';
    });
  </script>
</body>
</html>
